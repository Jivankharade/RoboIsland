<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>TwoCode</title>
<style>
/* The focus guard (focus-guard-main.cjs): you opened something that distracts you. The screen dims, Robo asks you to
   breathe in and out first, then you choose. Calm, dark, one card in the middle, like a Dynamic Island that grew big. */
@font-face { font-family: 'Inter'; font-weight: 100 900; src: url(../../assets/fonts/inter-latin-opsz-normal.woff2) format('woff2-variations'), url(./assets/fonts/inter-latin-opsz-normal.woff2) format('woff2-variations'); }
:root { --ink: #f5f5f7; --dim: rgba(235,235,245,.6); --eye: #e3ffd4; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: Inter, "Segoe UI", sans-serif; color: var(--ink); user-select: none; }
.dim { position: fixed; inset: 0; background: rgba(0,0,0,.62); opacity: 0; animation: fade .45s ease-out forwards; }
.card { position: fixed; left: 50%; top: 50%; width: 420px; padding: 34px 34px 28px; box-sizing: border-box; border-radius: 34px; background: #050506;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08); text-align: center;
  transform: translate(-50%, -46%) scale(.94); opacity: 0; animation: rise .5s cubic-bezier(.2,.9,.25,1) .08s forwards; }
.face { width: 132px; height: 46px; margin: 0 auto 22px; border-radius: 23px; background: #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
  display: flex; align-items: center; justify-content: center; gap: 14px; }
.eye { width: 11px; height: 20px; border-radius: 6px; background: var(--eye); box-shadow: 0 0 10px rgba(227,255,212,.55); animation: blink 4.2s infinite; }
.face.happy .eye { height: 9px; border-radius: 9px 9px 2px 2px; animation: none; }
h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -.3px; }
p { margin: 0; font-size: 14px; color: var(--dim); line-height: 1.45; }
.breath { position: relative; width: 150px; height: 150px; margin: 26px auto 22px; }
.ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(143,211,255,.35), rgba(143,211,255,.05) 70%); box-shadow: 0 0 0 1px rgba(143,211,255,.35);
  transform: scale(.55); }
.word { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
.go { display: flex; flex-direction: column; gap: 10px; }
button { font: inherit; border: 0; cursor: pointer; border-radius: 16px; height: 46px; font-size: 15px; font-weight: 600; transition: transform .12s, opacity .25s; }
button:active { transform: scale(.97); }
.back { background: #fff; color: #000; }
.anyway { background: transparent; color: var(--dim); height: 36px; font-size: 13px; font-weight: 500; }
.anyway[disabled] { opacity: .45; cursor: default; }
@keyframes fade { to { opacity: 1; } }
@keyframes rise { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .dim, .card { animation-duration: .01s; } .eye { animation: none; } }
</style></head>
<body>
<div class="dim"></div>
<div class="card" role="dialog" aria-labelledby="t">
  <div class="face" id="face"><i class="eye"></i><i class="eye"></i></div>
  <h1 id="t"></h1>
  <p id="sub"></p>
  <div class="breath" aria-hidden="true"><div class="ring" id="ring"></div><div class="word" id="word"></div></div>
  <div class="go">
    <button class="back" id="back"></button>
    <button class="anyway" id="anyway" disabled></button>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search), en = q.get('lang') !== 'nl';
const name = (q.get('name') || 'this').slice(0, 40), wait = Math.max(1, Math.min(30, Number(q.get('wait')) || 5)), allow = Number(q.get('allow')) || 5;
const T = en
  ? { title: `You’re opening ${name}`, sub: 'Take one breath first. Do you really want this right now?', in: 'Breathe in', out: 'Breathe out', back: 'Go back', anyway: s => s > 0 ? `Open ${name} anyway · ${s}` : `Open ${name} anyway (${allow} min)` }
  : { title: `Je opent ${name}`, sub: 'Adem eerst één keer rustig in en uit. Wil je dit echt nu?', in: 'Adem in', out: 'Adem uit', back: 'Terug', anyway: s => s > 0 ? `Toch ${name} openen · ${s}` : `Toch ${name} openen (${allow} min)` };
const $ = id => document.getElementById(id);
$('t').textContent = T.title; $('sub').textContent = T.sub; $('back').textContent = T.back;
// one slow breath over the waiting time: in for the first half, out for the second
const ring = $('ring'), word = $('word'), half = wait * 500;
const breathe = () => {
  word.textContent = T.in;
  ring.animate([{ transform: 'scale(.55)' }, { transform: 'scale(1)' }], { duration: half, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' });
  setTimeout(() => { word.textContent = T.out; ring.animate([{ transform: 'scale(1)' }, { transform: 'scale(.55)' }], { duration: half, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' }); }, half);
};
breathe();
let left = wait; const anyway = $('anyway');
const tick = () => { anyway.textContent = T.anyway(left); if (left <= 0) { anyway.disabled = false; return; } left--; setTimeout(tick, 1000); };
tick();
let chosen = false;
const choose = kind => { if (chosen) return; chosen = true; if (kind === 'back') $('face').classList.add('happy'); setTimeout(() => window.guard?.choose(kind), kind === 'back' ? 260 : 0); };
$('back').addEventListener('click', () => choose('back'));
anyway.addEventListener('click', () => { if (!anyway.disabled) choose('anyway'); });
addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); choose('back'); } });
$('back').focus();
</script>
</body></html>
